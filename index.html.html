<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mama Ngozi's — zobo, chin chin and puff puff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--hib:#6B1535;--leaf:#2F5D3A;--sun:#F2B632;--chalk:#FBF6F4;--ink:#2A1A20;--line:#E8D9D6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Figtree,sans-serif;color:var(--ink);background:var(--chalk)}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque',sans-serif;line-height:1.05;margin:0}
header{background:var(--hib);color:#fff;display:flex;gap:12px;align-items:center;padding:12px 20px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-size:1.4rem;font-weight:800;margin-right:auto;cursor:pointer}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--sun);color:var(--ink);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.ghost{background:transparent;color:inherit;border:1px solid currentColor}
button.green{background:var(--leaf);color:#fff}
.hero{background:var(--hib);color:#fff;padding:48px 20px 56px}
.hero h1{font-size:clamp(2.4rem,8vw,4.6rem);font-weight:800;max-width:14ch}
.hero p{max-width:46ch;margin:16px 0 0;font-size:1.1rem}
main{max-width:980px;margin:0 auto;padding:24px 20px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.card .e{font-size:2.4rem}
.card h3{font-size:1.25rem}
.price{font-weight:600;color:var(--leaf);margin-top:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.qty button{padding:4px 12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
label{display:block;font-weight:600;margin-top:12px}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:4px}
.msg{padding:12px;border-radius:8px;background:#fff3cd;margin-top:12px}
.err{background:#fde2e2}.ok{background:#dff3e3}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}}
</style>
</head>
<body>
<header>
  <span class="brand" onclick="go('shop')">Mama Ngozi's</span>
  <button class="ghost" onclick="go('shop')">Shop</button>
  <button class="ghost hide" id="ordersBtn" onclick="go('orders')">My orders</button>
  <button class="ghost" onclick="go('cart')">Cart (<span id="count">0</span>)</button>
  <button id="loginBtn" onclick="login()">Sign in with Google</button>
  <button class="ghost hide" id="logoutBtn" onclick="logout()">Log out</button>
</header>
<section class="hero" id="hero">
  <h1>Zobo cold. Chin chin crunchy.</h1>
  <p>Made in small batches in Surulere and delivered across Lagos. Order here, pay when it arrives.</p>
</section>
<main id="app"></main>

<script>
// ====== CONFIG: paste your values (Supabase > Project Settings > API) ======
const SUPABASE_URL = "https://jsjwitaivrrjnhczucwb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzandpdGFpdnJyam5oY3p1Y3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjIyNDAsImV4cCI6MjEwNjUzODI0MH0.GY6R303fXU-Fmn9eQjUP69nCF91oF63ASX0FYcNAAG0";
// ==========================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const naira = n => "₦" + Number(n).toLocaleString();
let products = [], user = null, view = "shop";
let cart = JSON.parse(localStorage.getItem("cart") || "{}"); // {productId: qty}

const saveCart = (push = true) => { localStorage.setItem("cart", JSON.stringify(cart)); $("#count").textContent = Object.values(cart).reduce((a,b)=>a+b,0); if (push) pushCart(); };
const add = id => { cart[id] = (cart[id]||0)+1; saveCart(); };
const setQty = (id,d) => { cart[id] = (cart[id]||0)+d; if (cart[id] < 1) delete cart[id]; saveCart(); render(); };
const total = () => Object.entries(cart).reduce((t,[id,q]) => t + (products.find(p=>p.id==id)?.price||0)*q, 0);

const login = async () => {
  const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin } });
  if (error) alert("Sign-in error: " + error.message);
};
const logout = async () => { await sb.auth.signOut(); user = null; cart = {}; localStorage.setItem("cartOwner", ""); saveCart(false); go("shop"); };
const go = v => { view = v; render(); scrollTo(0,0); };

async function init() {
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  sb.auth.onAuthStateChange((_e, s) => {
    const newUser = s?.user || null;
    const changed = newUser?.id !== user?.id;
    user = newUser;
    if (changed) { if (user) setTimeout(startCartSync, 0); else stopCartSync(); render(); }
  });
  if (user) setTimeout(startCartSync, 0);
  const { data: p, error } = await sb.from("products").select("*").eq("in_stock", true).order("id");
  products = p || [];
  saveCart(false); render();
  if (error) $("#app").innerHTML = `<div class="msg err">Could not load products: ${error.message}</div>`;
}

function render() {
  $("#loginBtn").classList.toggle("hide", !!user);
  $("#logoutBtn").classList.toggle("hide", !user);
  $("#ordersBtn").classList.toggle("hide", !user);
  $("#hero").classList.toggle("hide", view !== "shop");
  ({ shop: shopView, cart: cartView, checkout: checkoutView, orders: ordersView }[view])();
}

function shopView() {
  $("#app").innerHTML = `<div class="grid">${products.map(p => `
    <div class="card"><div class="e">${p.emoji}</div><h3>${p.name}</h3><div>${p.description}</div>
    <div class="price">${naira(p.price)}</div>
    <button onclick="add(${p.id});this.textContent='Added';setTimeout(()=>this.textContent='Add to cart',900)">Add to cart</button></div>`).join("")}</div>`;
}

function cartView() {
  const ids = Object.keys(cart);
  if (!ids.length) { $("#app").innerHTML = `<h2>Your cart is empty</h2><p>Pick something cold from the shop.</p><button onclick="go('shop')">Browse the shop</button>`; return; }
  $("#app").innerHTML = `<h2>Your cart</h2>` + ids.map(id => { const p = products.find(x=>x.id==id); if(!p) return "";
    return `<div class="row"><span>${p.emoji} ${p.name}</span><span class="qty"><button onclick="setQty(${id},-1)" aria-label="Fewer">−</button> ${cart[id]} <button onclick="setQty(${id},1)" aria-label="More">+</button></span><b>${naira(p.price*cart[id])}</b></div>`; }).join("")
    + `<div class="row"><b>Total</b><b>${naira(total())}</b></div><button class="green" onclick="go('checkout')">Go to checkout</button>`;
}

function checkoutView() {
  if (!Object.keys(cart).length) return go("cart");
  if (!user) { $("#app").innerHTML = `<div class="panel"><h2>Sign in to check out</h2><p>We use your Google account so you can see your orders later.</p><button onclick="login()">Sign in with Google</button></div>`; return; }
  $("#app").innerHTML = `<h2>Checkout</h2><div class="panel">
    <p>Order total: <b>${naira(total())}</b>. You pay on delivery.</p>
    <label>Full name<input id="n" value="${user.user_metadata?.full_name||""}"></label>
    <label>Phone<input id="ph" type="tel" placeholder="0803 000 0000"></label>
    <label>Delivery address<textarea id="ad" rows="3"></textarea></label>
    <p>Confirmation goes to <b>${user.email}</b>.</p>
    <button class="green" id="pay" onclick="placeOrder()">Place order</button><div id="status"></div></div>`;
}

async function placeOrder() {
  const name = document.getElementById("n").value.trim();
  const phone = (document.getElementById("ph")?.value || "").trim() || "not provided";
  const addr = document.getElementById("ad").value.trim();
  const missing = [!name && "name", !addr && "address"].filter(Boolean);
  if (missing.length) return $("#status").innerHTML = `<div class="msg err">Missing: ${missing.join(", ")}</div>`;
  $("#pay").disabled = true; $("#status").innerHTML = `<div class="msg">Placing your order…</div>`;
  const items = Object.entries(cart).map(([id,qty]) => ({ id:+id, qty }));
  const { data: oid, error } = await sb.rpc("place_order", { p_items: items, p_name: name, p_phone: phone, p_address: addr });
  if (error) { $("#pay").disabled = false; return $("#status").innerHTML = `<div class="msg err">Order failed: ${error.message}</div>`; }
  cart = {}; saveCart();
  const { error: mailErr } = await sb.functions.invoke("send-order-email", { body: { order_id: oid } });
  $("#app").innerHTML = `<div class="panel"><h2>Order placed</h2><p>Order #${oid.slice(0,8)} is in.</p>
    <div class="msg ${mailErr?'':'ok'}">${mailErr ? "Your order is saved, but the confirmation email did not send." : "Confirmation email sent to " + user.email}</div>
    <p><button onclick="go('orders')">See my orders</button></p></div>`;
}

async function ordersView() {
  if (!user) { $("#app").innerHTML = `<div class="panel"><h2>Sign in to see your orders</h2><button onclick="login()">Sign in with Google</button></div>`; return; }
  $("#app").innerHTML = `<h2>My orders</h2><p>Loading…</p>`;
  const { data, error } = await sb.from("orders").select("*, order_items(*)").order("created_at", { ascending: false });
  if (error) return $("#app").innerHTML = `<div class="msg err">${error.message}</div>`;
  $("#app").innerHTML = `<h2>My orders</h2>` + (data.length ? data.map(o => `<div class="panel">
    <b>#${o.id.slice(0,8)}</b> · ${new Date(o.created_at).toLocaleString()} · ${o.status}
    ${o.order_items.map(i => `<div class="row"><span>${i.qty} × ${i.name}</span><span>${naira(i.qty*i.unit_price)}</span></div>`).join("")}
    <div class="row"><b>Total</b><b>${naira(o.total)}</b></div></div>`).join("") : `<p>No orders yet.</p>`);
}
// ---- Cart sync with Supabase (shared with the mobile app) ----
let pushing = 0, chan = null, pullTimer;
async function pushCart() {
  if (!user) return;
  pushing++;
  try {
    const rows = Object.entries(cart).map(([id, qty]) => ({ user_id: user.id, product_id: +id, qty }));
    if (rows.length) await sb.from("cart_items").upsert(rows);
    let q = sb.from("cart_items").delete().eq("user_id", user.id);
    if (rows.length) q = q.not("product_id", "in", `(${rows.map(r => r.product_id).join(",")})`);
    await q;
  } finally { pushing--; }
}
async function pullCart(merge) {
  if (!user || pushing) return;
  const { data, error } = await sb.from("cart_items").select("product_id,qty");
  if (error) return;
  const db = {};
  data.forEach(r => db[r.product_id] = r.qty);
  if (merge) Object.entries(cart).forEach(([id, q]) => { db[id] = Math.max(db[id] || 0, q); });
  cart = db;
  localStorage.setItem("cartOwner", user.id);
  saveCart(merge);
  if (view === "shop" || view === "cart") render();
}
function startCartSync() {
  if (!user) return;
  pullCart(localStorage.getItem("cartOwner") !== user.id);
  if (chan) sb.removeChannel(chan);
  chan = sb.channel("cart-sync").on("postgres_changes", { event: "*", schema: "public", table: "cart_items" },
    () => { clearTimeout(pullTimer); pullTimer = setTimeout(() => pullCart(false), 300); }).subscribe();
  if (!window._vis) { window._vis = 1; document.addEventListener("visibilitychange", () => { if (!document.hidden) pullCart(false); }); }
}
function stopCartSync() { if (chan) sb.removeChannel(chan); chan = null; }

init();
</script>
</body>
</html>
